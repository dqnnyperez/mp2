name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh market snapshot when a key is configured
        env:
          SUGRA_API_KEY: ${{ secrets.SUGRA_API_KEY }}
        run: |
          if [ -n "$SUGRA_API_KEY" ]; then
            npm run refresh:history || echo "History refresh unavailable; retaining saved history."
            npm run refresh:data || echo "Refresh unavailable; deploying the checked-in snapshot."
          else
            echo "Using the checked-in market snapshot."
          fi

      - name: Build site
        run: npm run build

      - name: Support direct detail URLs
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
